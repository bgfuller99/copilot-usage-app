name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Ensure no local demo code or data in the build
        run: |
          if grep -rIl -E "__local-demo|LOCAL_DEMO_XLSX|\.copilot/attachments" dist; then
            echo "::error::Local-only demo code or paths found in dist" && exit 1
          fi
          if find dist -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' | grep .; then
            echo "::error::Data files found in dist" && exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
